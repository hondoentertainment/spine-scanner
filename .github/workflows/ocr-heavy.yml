name: OCR Heavy Checks

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ocr-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ocr-validation:
    name: OCR integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Generate OCR fixture
        run: npm run generate-ocr-fixture
      - name: OCR integration tests
        run: npm run test:integration
        timeout-minutes: 20

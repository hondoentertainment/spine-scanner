name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to roll back to (e.g. v1.2.3). Run "git tag" to list available tags.'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  rollback:
    name: Roll back to ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate tag format
        run: |
          if ! echo "${{ inputs.tag }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "❌ Invalid tag format. Expected vX.Y.Z (e.g. v1.2.3)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build at tag ${{ inputs.tag }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy rollback build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "rollback: deploy ${{ inputs.tag }} [skip ci]"

      - name: Create rollback record
        run: |
          echo "✅ Rolled back to ${{ inputs.tag }} in ${{ inputs.environment }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Time: $(date -u)"

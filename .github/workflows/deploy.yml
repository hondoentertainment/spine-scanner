# Manual fallback Pages deploy. The primary deploy path is ci.yml, which
# auto-deploys to BOTH GitHub Pages and Vercel on push to main. Use this
# workflow only for one-off rebuilds (e.g. to redeploy without a code push,
# or to deploy a specific branch via workflow_dispatch).
name: Deploy static content to Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate production config shape
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          VITE_BASE_PATH: /spine-scanner/
          # Operators should set repository variable VITE_SUPPORT_EMAIL for real support address.
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: production
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run check:production

      - name: Test with coverage
        run: npm run test:coverage
        timeout-minutes: 15

      - name: Build
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: production
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: production
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run test:e2e:release
        timeout-minutes: 10

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

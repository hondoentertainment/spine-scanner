name: Quality (bundle + Lighthouse)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Check bundle budgets
        run: node scripts/check-bundle-budget.mjs

      - name: Nest dist for Lighthouse (flat Vite output vs /spine-scanner/ asset URLs)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          shopt -s dotglob nullglob
          for f in dist/*; do
            mv "$f" "$tmp/"
          done
          mkdir -p dist/spine-scanner
          mv "$tmp"/* dist/spine-scanner/
          rmdir "$tmp"

      - name: Setup Chrome for Lighthouse
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run Lighthouse CI
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx lhci autorun

name: Lint, Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # lint + unit tests (up to 18m) + build + Playwright install + E2E (up to 12m)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check production
        env:
          VITE_SITE_URL: ${{ github.ref == 'refs/heads/main' && (vars.VITE_SITE_URL != '' && vars.VITE_SITE_URL || format('https://{0}.github.io', github.repository_owner)) || 'https://example.com' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || '/spine-scanner/' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run check:production

      - name: Test
        timeout-minutes: 18
        run: npm test

      - name: Build
        env:
          VITE_SITE_URL: ${{ github.ref == 'refs/heads/main' && (vars.VITE_SITE_URL != '' && vars.VITE_SITE_URL || format('https://{0}.github.io', github.repository_owner)) || 'https://example.com' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || '/spine-scanner/' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      # Persist the build for both deploy jobs (Pages + Vercel-prebuilt).
      # Pages-specific upload also runs so actions/deploy-pages can find it.
      - name: Upload build for deploy jobs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E release tests
        timeout-minutes: 12
        env:
          CI: 'true'
          VITE_SITE_URL: ${{ github.ref == 'refs/heads/main' && (vars.VITE_SITE_URL != '' && vars.VITE_SITE_URL || format('https://{0}.github.io', github.repository_owner)) || 'https://example.com' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || '/spine-scanner/' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run test:e2e:release

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Deploy to GitHub Pages. Runs only on push to main, after verify passes.
  # Uses the Pages artifact uploaded by `verify`.
  deploy-pages:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Deploy to Vercel via the Vercel CLI. Runs only on push to main, after verify passes.
  # Requires repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  # IMPORTANT: To avoid duplicate deploys, disable the Vercel-GitHub auto-deploy
  # in the Vercel project dashboard (Settings → Git → Disconnect, or set
  # "deployHooks only"). Only this workflow should produce production deploys.
  deploy-vercel:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Report visibly when Vercel deploy is skipped due to missing secrets.
      # The steps below use `if: env.VERCEL_TOKEN != ''` (silent skip) so this
      # step surfaces "no deploy happened" in the Actions UI. Non-blocking.
      - name: Verify Vercel deploy secrets
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=(VERCEL_TOKEN)
          [ -z "$VERCEL_ORG_ID" ] && missing+=(VERCEL_ORG_ID)
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Vercel deploy is not configured; skipping. Missing secret(s): ${missing[*]}"
            echo "::warning::Set them at Settings → Secrets and variables → Actions, then re-run this job."
          else
            echo "All Vercel deploy secrets present."
          fi

      - name: Pull Vercel project info
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL != '' && vars.VITE_SITE_URL || 'https://spinescanner.app' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH_VERCEL != '' && vars.VITE_BASE_PATH_VERCEL || '/' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL != '' && vars.VITE_SUPPORT_EMAIL || 'noreply@example.com' }}
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: production
          VITE_APP_RELEASE: ${{ github.sha }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # Posts to DEPLOY_ALERT_WEBHOOK (Slack- or Discord-compatible incoming webhook)
  # when either deploy job fails on main. Degrades silently when the secret is unset.
  # Note: `deploy-vercel` skips its Vercel steps when secrets are missing rather
  # than failing, so those "no-op" runs don't fire this alert; only real failures do.
  notify-deploy-failure:
    needs: [deploy-pages, deploy-vercel]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post failure to alert webhook
        env:
          WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DEPLOY_ALERT_WEBHOOK not configured; skipping deploy-failure notification."
            exit 0
          fi
          short_sha="${SHA:0:7}"
          msg="SpineScanner production deploy failed on main — ${short_sha}
          ${RUN_URL}"
          # Slack uses {text}; Discord uses {content}. Sending both is harmless to either.
          payload=$(jq -nc --arg t "$msg" '{text: $t, content: $t}')
          if ! curl -fsSL -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"; then
            echo "::warning::Failed to deliver deploy-failure notification to webhook."
          fi

name: Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # lint + sharded unit tests + build + Playwright + E2E
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check production
        env:
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run check:production

      # Two shards in parallel (~half wall time vs one vitest run; avoids step timeouts on large suite)
      - name: Test
        timeout-minutes: 30
        run: |
          set -e
          npx vitest run --shard=1/2 &
          pid1=$!
          npx vitest run --shard=2/2 &
          pid2=$!
          wait "$pid1"
          s1=$?
          wait "$pid2"
          s2=$?
          if [ "$s1" -ne 0 ]; then exit "$s1"; fi
          if [ "$s2" -ne 0 ]; then exit "$s2"; fi

      - name: Build
        env:
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E release tests
        timeout-minutes: 12
        env:
          CI: 'true'
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run test:e2e:release

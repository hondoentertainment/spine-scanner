name: Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # lint + unit tests (up to 18m) + build + Playwright install + E2E (up to 12m)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Check production
        env:
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run check:production

      - name: Test
        timeout-minutes: 18
        run: npm test

      - name: Build
        env:
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E release tests
        timeout-minutes: 12
        env:
          CI: 'true'
          VITE_SITE_URL: https://example.com
          VITE_BASE_PATH: /spine-scanner/
          VITE_SUPPORT_EMAIL: noreply@example.com
          VITE_ENABLE_SCANNER_DEBUG: 'false'
          VITE_APP_ENV: test
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run test:e2e:release

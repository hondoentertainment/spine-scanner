  <text x="824" y="408" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Works offline</text>
  <text x="824" y="445" fill="#A5B4C7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Stay local or connect Supabase when ready.</text>
